
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeWork</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f1f3f5;
            padding: 30px 12px;
        }

        .card-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0001;
            height: 100%;
        }

        .calculator {
            background: #222831;
            padding: 18px;
            border-radius: 15px;
            max-width: 350px;
            margin: auto;
        }

        .calculator-display {
            background: #e2e8f0;
            color: #111;
            height: 150px;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        #expression {
            font-size: 32px;
            text-align: left;
            white-space: nowrap;
            overflow-x: auto;
        }

        #result {
            font-size: 32px;
            font-weight: bold;
            color: #475569;
            text-align: right;
            min-height: 38px;
        }

        .calc-btn {
            width: 100%;
            height: 50px;
            font-size: 20px;
        }

        .number-list {
            max-height: 200px;
            overflow-y: auto;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="container">
    <h2 class="text-center mb-4"> Calculator</h2>

    <div class="row g-3 align-items-stretch">

        <!-- Odd Numbers: Left -->
        <div class="col-12 col-lg-4">
            <div class="card-box">
                <h4 class="text-center text-primary">Odd Numbers</h4>
                <p>Numbers from 1 to 100</p>
                <div id="oddNumbers" class="number-list"></div>
                <hr>
                <h5>Sum: <span id="oddSum">0</span></h5>
            </div>
        </div>

        <!-- Calculator: Middle -->
        <div class="col-12 col-lg-4">
            <div class="calculator">

                <div class="calculator-display">
                    <div id="expression">0</div>
                    <div id="result"></div>
                </div>

                <div class="row g-2">
                    <div class="col-3">
                        <button class="btn btn-secondary calc-btn" onclick="clearDisplay()">C</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-secondary calc-btn" onclick="backspace()">⌫</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-warning calc-btn" onclick="inputOperator('%')">%</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-warning calc-btn" onclick="inputOperator('/')">÷</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-light calc-btn" onclick="inputNumber('7')">7</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light calc-btn" onclick="inputNumber('8')">8</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light calc-btn" onclick="inputNumber('9')">9</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-warning calc-btn" onclick="inputOperator('*')">×</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-light calc-btn" onclick="inputNumber('4')">4</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light calc-btn" onclick="inputNumber('5')">5</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light calc-btn" onclick="inputNumber('6')">6</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-warning calc-btn" onclick="inputOperator('-')">−</button>
                    </div>

                    <div class="col-3">
                        <button class="btn btn-light calc-btn" onclick="inputNumber('1')">1</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light calc-btn" onclick="inputNumber('2')">2</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light calc-btn" onclick="inputNumber('3')">3</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-warning calc-btn" onclick="inputOperator('+')">+</button>
                    </div>

                    <div class="col-6">
                        <button class="btn btn-light calc-btn" onclick="inputNumber('0')">0</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light calc-btn" onclick="inputNumber('.')">.</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-success calc-btn" onclick="calculate()">=</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Even Numbers: Right -->
        <div class="col-12 col-lg-4">
            <div class="card-box">
                <h4 class="text-center text-success">Even Numbers</h4>
                <p>Numbers from 1 to 100</p>
                <div id="evenNumbers" class="number-list"></div>
                <hr>
                <h5>Sum: <span id="evenSum">0</span></h5>
            </div>
        </div>

    </div>
</div>

<script>
    // Odd and Even Numbers
    let oddSum = 0;
    let evenSum = 0;

    for (let i = 1; i <= 100; i++) {
        if (i % 2 === 0) {
            document.getElementById("evenNumbers").innerHTML += i + ", ";
            evenSum += i;
        } else {
            document.getElementById("oddNumbers").innerHTML += i + ", ";
            oddSum += i;
        }
    }

    document.getElementById("oddSum").textContent = oddSum;
    document.getElementById("evenSum").textContent = evenSum;


    // Calculator
    let expression = "";
    let justCalculated = false;

    const expressionDisplay = document.getElementById("expression");
    const resultDisplay = document.getElementById("result");

    function updateExpression() {
        expressionDisplay.textContent = expression || "0";
        expressionDisplay.scrollLeft = expressionDisplay.scrollWidth;
    }

    function getResult() {
        if (!expression || !/^[0-9+\-*/%.() ]+$/.test(expression)) {
            return null;
        }

        try {
            // Evaluate only validated arithmetic expressions
            const result = Function('"use strict"; return (' + expression + ')')();

            if (typeof result !== "number" || !Number.isFinite(result)) {
                return null;
            }

            return Number(result.toPrecision(12));
        } catch {
            return null;
        }
    }

    function updateResult() {
        const result = getResult();
        resultDisplay.textContent = result === null ? "" : result;
    }

    function inputNumber(number) {
        if (justCalculated) {
            expression = "";
            justCalculated = false;
        }

        if (number === ".") {
            const currentNumber = expression.split(/[+\-*/%]/).pop();

            if (currentNumber.includes(".")) return;

            if (currentNumber === "") expression += "0";
        }

        expression += number;
        updateExpression();
        updateResult();
    }

    function inputOperator(operator) {
        if (justCalculated) {
            justCalculated = false;
        }

        if (expression === "") {
            if (operator === "-") expression = "-";
            else return;
        } else if (/[+\-*/%.]$/.test(expression)) {
            expression = expression.slice(0, -1) + operator;
        } else {
            expression += operator;
        }

        updateExpression();
        updateResult();
    }

    function calculate() {
        const result = getResult();

        if (result === null) {
            resultDisplay.textContent = "Error";
            return;
        }

        resultDisplay.textContent = result;
        justCalculated = true;
    }

    function clearDisplay() {
        expression = "";
        justCalculated = false;
        updateExpression();
        resultDisplay.textContent = "";
    }

    function backspace() {
        if (justCalculated) {
            clearDisplay();
            return;
        }

        expression = expression.slice(0, -1);
        updateExpression();
        updateResult();
    }
</script>

</body>
</html>
