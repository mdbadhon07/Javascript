```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cart</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6fa;
            font-family: Arial, sans-serif;
        }

        .cart-card {
            max-width: 550px;
            margin: 80px auto;
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.07);
        }

        .product-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quantity-box button {
            width: 32px;
            height: 32px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 6px;
            font-size: 18px;
            line-height: 1;
        }

        .quantity-box button:hover {
            background: #212529;
            color: white;
        }

        .quantity {
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }

        .total-price {
            font-size: 22px;
            font-weight: 700;
            color: #198754;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="cart-card">

        <h4 class="mb-4">Shopping Cart</h4>

        <!-- Product -->
        <div class="d-flex align-items-center gap-3">

            <img
                src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300"
                class="product-img"
                alt="Product"
            >

            <div class="flex-grow-1">
                <h6 class="mb-1">Nike Running Shoes</h6>
                <p class="text-muted mb-0">$50.00 / item</p>
            </div>

            <!-- Quantity -->
            <div class="quantity-box">
                <button id="minusBtn">−</button>
                <span class="quantity" id="quantity">1</span>
                <button id="addBtn">+</button>
            </div>

        </div>

        <hr class="my-4">

        <!-- Price Section -->

        <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Product Price</span>
            <span id="unitPrice">$50.00</span>
        </div>

        <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Quantity</span>
            <span id="priceQty">1</span>
        </div>

        <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Discount (%)</span>
            <span id="discountPercent">0%</span>
        </div>

        <div class="d-flex justify-content-between mb-3">
            <span class="text-muted">Discount Amount</span>
            <span id="discountAmount">$0.00</span>
        </div>

        <hr>

        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Total Price</h5>
            <span class="total-price" id="totalPrice">$50.00</span>
        </div>

        <button class="btn btn-dark w-100 mt-4 py-2">
            Proceed to Checkout
        </button>

    </div>
</div>


<script>

    // Product Information

    const productPrice = 50;
    const maxQt = 10;
    const minQt = 1;

    // HTML Elements

    let addBtn = document.querySelector("#addBtn");
    let minusBtn = document.querySelector("#minusBtn");

    let quantity = document.querySelector("#quantity");
    let priceQty = document.querySelector("#priceQty");

    let discountPercent = document.querySelector("#discountPercent");
    let discountAmountText = document.querySelector("#discountAmount");

    let totalPrice = document.querySelector("#totalPrice");

    // Initial Quantity

    let count = 1;


    // Add Button

    addBtn.addEventListener("click", () => {

        if (count >= maxQt) {
            alert("Maximum 10 products allowed");
            return;
        }

        count++;

        updateCart();

    });


    // Minus Button

    minusBtn.addEventListener("click", () => {

        if (count <= minQt) {
            alert("Minimum 1 product required");
            return;
        }

        count--;

        updateCart();

    });


    // Discount Function

    function discount(productQT, totalPrice) {

        let diAmount = 0;

        if (productQT >= 5 && productQT < 8) {

            diAmount = (totalPrice * 10) / 100;

        } else if (productQT >= 8) {

            diAmount = (totalPrice * 20) / 100;

        }

        return diAmount;

    }


    // Update Cart Function

    function updateCart() {

        // Calculate Product Price

        let productsPrice = productPrice * count;

        // Calculate Discount Amount

        let discountAmount = discount(count, productsPrice);

        // Calculate Discount Percentage

        let percent = 0;

        if (count >= 8) {

            percent = 20;

        } else if (count >= 5) {

            percent = 10;

        }

        // Calculate Final Price

        let finalPrice = productsPrice - discountAmount;


        // Update HTML

        quantity.textContent = count;

        priceQty.textContent = count;

        discountPercent.textContent = percent + "%";

        discountAmountText.textContent = "$" + discountAmount.toFixed(2);

        totalPrice.textContent = "$" + finalPrice.toFixed(2);

    }

</script>

</body>
</html>
