
<!DOCTYPE html>
<html>
<head>
    <title>Product Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6fa;
        }

        .cart-card {
            max-width: 550px;
            margin: 80px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.07);
        }

        .product-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="cart-card">

        <h4 class="mb-4">Shopping Cart</h4>

        <!-- Product -->

        <div class="d-flex align-items-center gap-3">

            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300"
                 class="product-img">

            <div class="flex-grow-1">
                <h6>Nike Running Shoes</h6>
                <p class="text-muted">$50.00 / item</p>
            </div>

            <button id="minusBtn">-</button>

            <span id="quantity">1</span>

            <button id="addBtn">+</button>

        </div>

        <hr>

        <!-- Price Section -->

        <div class="d-flex justify-content-between mb-2">
            <span>Product Price</span>
            <span>$50.00</span>
        </div>

        <div class="d-flex justify-content-between mb-2">
            <span>Quantity</span>
            <span id="priceQty">1</span>
        </div>

        <div class="d-flex justify-content-between mb-2">
            <span>Discount (%)</span>
            <span id="percent">0%</span>
        </div>

        <div class="d-flex justify-content-between mb-2">
            <span>Discount Amount</span>
            <span id="discount">$0.00</span>
        </div>

        <hr>

        <!-- Total Price -->

        <div class="d-flex justify-content-between">
            <h5>Total Price</h5>
            <h5 id="total">$50.00</h5>
        </div>

        <hr>

        <!-- Next Discount Offer -->

        <div class="d-flex justify-content-between gap-2">
            <span class="text-muted">Next Discount Offer</span>
            <span id="nextOffer" class="text-success text-end">
                Buy 4 more for 10% discount
            </span>
        </div>

        <button class="btn btn-dark w-100 mt-4 py-2">
            Proceed to Checkout
        </button>

    </div>

</div>


<script>

    let count = 1;
    let price = 50;

    let quantity = document.getElementById("quantity");
    let priceQty = document.getElementById("priceQty");

    let percent = document.getElementById("percent");
    let discount = document.getElementById("discount");
    let total = document.getElementById("total");

    let nextOffer = document.getElementById("nextOffer");


    // Add Button

    document.getElementById("addBtn").addEventListener("click", function() {

        if (count < 10) {
            count++;
            calculate();
        }

    });


    // Minus Button

    document.getElementById("minusBtn").addEventListener("click", function() {

        if (count > 1) {
            count--;
            calculate();
        }

    });


    // Calculate Everything

    function calculate() {

        let totalPrice = price * count;

        let discountPercent = 0;

        if (count >= 5 && count < 8) {
            discountPercent = 10;
        }

        else if (count >= 8) {
            discountPercent = 20;
        }


        let discountAmount = totalPrice * discountPercent / 100;

        let finalPrice = totalPrice - discountAmount;


        // Update Quantity

        quantity.textContent = count;
        priceQty.textContent = count;


        // Update Discount

        percent.textContent = discountPercent + "%";

        discount.textContent = "$" + discountAmount.toFixed(2);


        // Update Total Price

        total.textContent = "$" + finalPrice.toFixed(2);


        // Next Discount Offer

        if (count < 5) {

            nextOffer.textContent = "Buy " + (5 - count) + " more for 10% discount";

        }

        else if (count < 8) {

            nextOffer.textContent = "Buy " + (8 - count) + " more for 20% discount";

        }

        else {

            nextOffer.textContent = "Maximum discount reached!";

        }

    }

</script>

</body>
</html>
