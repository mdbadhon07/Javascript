
<!DOCTYPE html>
<html>
<head>
    <title>Product Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="cart-card">

        <h4 class="mb-4">Shopping Cart</h4>



        <div class="d-flex align-items-center gap-3">

            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300"
                 >

            <div class="d-flex flex-column gap-1 ">
                <h6>Nike Running Shoes</h6>
                <p>$50.00 / item</p>
            </div>

           <div class="d-flex align-items-center gap-2 ms-auto">
             <button id="minusBtn" >-</button>

            <span id="quantity">1</span>

            <button id="addBtn">+</button>
           </div>

        </div>

        <hr>


        <div class="d-flex justify-content-between ">
            <span>Product Price</span>
            <span>$50.00</span>
        </div>

        <div class="d-flex justify-content-between ">
            <span>Quantity</span>
            <span id="Qty">1</span>
        </div>

        <div class="d-flex justify-content-between ">
            <span>Discount (%)</span>
            <span id="percent">0%</span>
        </div>

        <div class="d-flex justify-content-between ">
            <span>Discount Amount</span>
            <span id="discount">$0.00</span>
        </div>

        <hr>


        <div class="d-flex justify-content-between">
            <h5>Total Price</h5>
            <h5 id="total">$50.00</h5>
        </div>

        <hr>



        <div class="d-flex justify-content-between gap-2">
            <h6>Next Discount Offer</h6>
          <h6 id="nextOffer"> Buy 4 more for 10% discount</h6> 

        </div>

        <button class="btn btn-dark w-100 mt-3 py-2">
            Proceed to Checkout
        </button>

    </div>

</div>


<script>

    let count = 1;
    let price = 50;

     let Qty = document.getElementById("Qty");

    let percent = document.getElementById("percent");
    let discount = document.getElementById("discount");
    let total = document.getElementById("total");

    let nextOffer = document.getElementById("nextOffer");


    

    document.getElementById("addBtn").addEventListener("click", function() {

        if (count < 10) {
            count++;
            calculate();
        }
        else {
            alert("Maximum quantity reached!");
        }

    });


    

    document.getElementById("minusBtn").addEventListener("click", function() {

        if (count > 1) {
            count--;
            calculate();
        }
        else {
            alert("Minimum quantity is 1!");
        }

    });



    function calculate() {

        let totalPrice = price * count;

        let discountPercent = 0;

        if (count >= 5 && count < 8) {
            discountPercent = 10;
        }

        else if (count >= 8) {
            discountPercent = 20;
        }


        let discountAmount = totalPrice * discountPercent / 100;

        let finalPrice = totalPrice - discountAmount;


       
        quantity.textContent = count;
        Qty.textContent = count;


       
        percent.textContent = discountPercent + "%";

        discount.textContent = "$" + discountAmount.toFixed(2);


       

        total.textContent = "$" + finalPrice.toFixed(2);


        

        if (count < 5) {

            nextOffer.textContent = "Buy " + (5 - count) + " more for 10% discount";

        }

        else if (count < 8) {

            nextOffer.textContent = "Buy " + (8 - count) + " more for 20% discount";

        }

        else {

            nextOffer.textContent = "Maximum discount reached!";

        }

    }

</script>

</body>
</html>
